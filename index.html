<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marketing Website</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f7fa;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header .logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: #3b5bdb;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 1.5rem;
    }

    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 1rem;
      color: #1a1a2e;
    }

    .hero p {
      font-size: 1.125rem;
      color: #4a5568;
      max-width: 520px;
      margin: 0 auto 2.5rem;
      line-height: 1.7;
    }

    .btn-hello {
      display: inline-block;
      padding: 0.875rem 2.25rem;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background: #3b5bdb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 14px rgba(59, 91, 219, 0.35);
      letter-spacing: 0.01em;
    }

    .btn-hello:hover {
      background: #2f4ac5;
      box-shadow: 0 6px 20px rgba(59, 91, 219, 0.45);
      transform: translateY(-1px);
    }

    .btn-hello:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(59, 91, 219, 0.3);
    }

    footer {
      text-align: center;
      padding: 1.25rem;
      font-size: 0.875rem;
      color: #718096;
      border-top: 1px solid #e2e8f0;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <header>
    <span class="logo">Marketing Co.</span>
  </header>

  <main>
    <section class="hero">
      <h1>Welcome to Our Website</h1>
      <p>We help teams build better products, faster. Say hello and let's get started together.</p>
      <button class="btn-hello" onclick="alert('Hello everyone!')">Hello everyone</button>
    </section>
  </main>

  <footer>
    &copy; 2026 Marketing Co. All rights reserved.
  </footer>
</body>
</html>
